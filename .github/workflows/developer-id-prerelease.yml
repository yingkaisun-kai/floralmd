# Modified from Edmund by Yingkai Sun for FloralMD.
name: Developer ID Pre-release

on:
  push:
    tags:
      - 'preview-v*'

permissions:
  contents: read

concurrency:
  group: floralmd-developer-id-prerelease
  cancel-in-progress: false

jobs:
  test:
    name: Test and build without release secrets
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Toolchain version
        run: |
          xcodebuild -version
          swift --version

      - name: Test release controls
        run: python3 -m unittest discover -s scripts/tests

      - name: Test application
        run: swift test

      - name: Build secret-free production candidate
        run: ./scripts/build-app.sh --variant production

  release:
    name: Sign, notarize, and publish one immutable DMG
    needs: test
    runs-on: macos-26
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Validate protected preview tag
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)"
          python3 scripts/validate-developer-id-prerelease.py tag \
            --tag "$GITHUB_REF_NAME" \
            --version "$VERSION" \
            --build "$BUILD"
          # The preview may be tagged before the prepared public snapshot is
          # advanced onto origin/main, but it must descend from current public
          # main. This keeps preview permission separate from a main push.
          git merge-base --is-ancestor origin/main "$GITHUB_SHA"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Refuse release asset conflicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      - name: Build official production app
        run: ./scripts/build-app.sh --variant production

      - name: Sign, notarize, staple, and create final bytes
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          FLORALMD_SPARKLE_ED_PRIVATE_KEY: ${{ secrets.FLORALMD_SPARKLE_ED_PRIVATE_KEY }}
        run: |
          ./scripts/developer-id-prerelease.sh \
            build/FloralMD.app \
            "build/FloralMD-${VERSION}.dmg"

      - name: Attest final DMG provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: build/FloralMD-${{ env.VERSION }}.dmg

      - name: Prepare pre-release notes
        run: |
          python3 scripts/extract-release-notes.py "$VERSION" > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/FloralMD-${VERSION}.dmg" \
            "build/FloralMD-${VERSION}.sha256" \
            "build/FloralMD-${VERSION}.sparkle-signature.txt" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "FloralMD ${VERSION} Preview" \
            --notes-file release-notes.md

      - name: Verify uploaded DMG is byte-identical
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOCAL_DIGEST="sha256:$(shasum -a 256 "build/FloralMD-${VERSION}.dmg" | awk '{print $1}')"
          REMOTE_DIGEST="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
              --jq ".assets[] | select(.name == \"FloralMD-${VERSION}.dmg\") | .digest"
          )"
          if [ "$REMOTE_DIGEST" != "$LOCAL_DIGEST" ]; then
            echo "Uploaded DMG digest differs from the final local bytes." >&2
            exit 1
          fi

      # Deliberately no feed checkout or appcast update: the first signed build
      # is a GitHub Pre-release and must remain invisible to stable Sparkle users.
